[package]
name = "reading_app"
version = "0.1.0"
authors = ["ℭ𝔦𝔭𝔥𝔢𝔯", "https://github.com/cipher-rc5"]
categories = ["gui"]
edition = "2024"
keywords = ["reading", "gui", "egui"]
license = "MIT OR Apache-2.0"
readme = "readme.md"
repository = "https://github.com/cipher_rc5/reading_app"
description = "application for dynamically generating reading passages"

[features]
default = []
# Add feature flags here as needed
# offline-mode = []
# premium = []

[dependencies]
# GUI Framework
eframe = { version = "0.32", features = ["default_fonts", "glow", "persistence"] }
egui = "0.32"
tokio = { version = "1", features = ["full", "macros"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "blocking"] }

# Database
libsql = "0.9"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Configuration
dotenvy = "0.15"

# Error handling
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "ansi"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Utilities
dirs = "6.0"
uuid = { version = "1", features = ["v4", "serde"] }
webbrowser = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

# Optimize dependencies in dev mode for better performance
[profile.dev.package."*"]
opt-level = 2
